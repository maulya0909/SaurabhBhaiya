          package com.saurabh.bhaiya

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.view.View
          import android.widget.EditText
          import android.widget.ImageButton
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import com.google.android.material.button.MaterialButtonToggleGroup
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private val apiUrl = "https://api.anthropic.com/v1/messages"
              private val model = "claude-haiku-5-5"
              private val systemPrompt =
                  "You are SAURABH BHAIYA, a friendly male voice assistant. " +
                  "Always reply in the same language the user spoke (Marathi, Hindi or English). " +
                  "Keep answers short: 1 to 3 simple spoken sentences. No markdown, no emojis, no lists."

              private lateinit var tts: TextToSpeech
              private var ttsReady = false
              private var recognizer: SpeechRecognizer? = null
              private var listening = false
              private var langTag = "mr-IN"
              private val history = mutableListOf<Pair<String, String>>()

              private lateinit var chat: TextView
              private lateinit var status: TextView
              private lateinit var scroll: ScrollView
              private var firstMessage = true

              private val micPermission =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { ok ->
                      if (ok) startListening() else setStatus("माइक परवानगी हवी आहे")
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  chat = findViewById(R.id.chat)
                  status = findViewById(R.id.status)
                  scroll = findViewById(R.id.scroll)
                  tts = TextToSpeech(this) { s -> ttsReady = (s == TextToSpeech.SUCCESS) }

                  val toggle = findViewById<MaterialButtonToggleGroup>(R.id.toggle)
                  toggle.check(R.id.btnMr)
                  toggle.addOnButtonCheckedListener { _, id, checked ->
                      if (checked) langTag = when (id) {
                          R.id.btnHi -> "hi-IN"
                          R.id.btnEn -> "en-IN"
                          else -> "mr-IN"
                      }
                  }
                  findViewById<ImageButton>(R.id.btnMic).setOnClickListener {
                      if (listening) recognizer?.stopListening() else checkPermissionAndListen()
                  }
                  findViewById<View>(R.id.btnKey).setOnClickListener { showKeyDialog() }
              }

              override fun onDestroy() {
                  recognizer?.destroy()
                  tts.stop(); tts.shutdown()
                  super.onDestroy()
              }

              private fun checkPermissionAndListen() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                      == PackageManager.PERMISSION_GRANTED
                  ) startListening() else micPermission.launch(Manifest.permission.RECORD_AUDIO)
              }

              private fun startListening() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      setStatus("Google Speech सेवा उपलब्ध नाही (Google app अपडेट करा)")
                      return
                  }
                  tts.stop()
                  recognizer?.destroy()
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this).apply {
                      setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(p: Bundle?) { listening = true; setStatus("ऐकत आहे… बोला") }
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(v: Float) {}
                          override fun onBufferReceived(b: ByteArray?) {}
                          override fun onEndOfSpeech() { setStatus("समजून घेत आहे…") }
                          override fun onError(e: Int) { listening = false; setStatus("परत प्रयत्न करा (कोड $e)") }
                          override fun onPartialResults(p: Bundle?) {}
                          override fun onEvent(t: Int, p: Bundle?) {}
                          override fun onResults(r: Bundle?) {
                              listening = false
                              val text = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                              if (text.isNullOrBlank()) setStatus("काही ऐकू आले नाही") else handleUserText(text)
                          }
                      })
                  }
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, langTag)
                  }
                  recognizer?.startListening(i)
              }

              private fun handleUserText(text: String) {
                  addChat("तुम्ही", text)
                  if (tryOpenApp(text)) return
                  askAI(text)
              }

              private val triggers = listOf(
                  "open", "launch", "ओपन", "उघड", "खोल", "चालू कर", "सुरू कर", "शुरू कर"
              )
              private val fillers = listOf(
                  "the", "app", "please", "ॲप", "अॅप", "ऐप", "एप", "प्लीज", "कर", "करा", "करो", "दो", "दे", "द्या", "ना"
              )
              private val aliases = mapOf(
                  "व्हाट्सएप" to "whatsapp", "व्हॉट्सॲप" to "whatsapp", "व्हॉट्सअॅप" to "whatsapp", "व्हाट्सऐप" to "whatsapp",
                  "यूट्यूब" to "youtube", "यूट्युब" to "youtube",
                  "क्रोम" to "chrome", "गुगल" to "google", "गूगल" to "google",
                  "कॅमेरा" to "camera", "कैमरा" to "camera",
                  "सेटिंग्ज" to "settings", "सेटिंग" to "settings",
                  "कॅल्क्युलेटर" to "calculator", "कैलकुलेटर" to "calculator",
                  "गॅलरी" to "gallery", "गैलरी" to "gallery",
                  "फोन" to "phone", "मेसेज" to "messages", "मैसेज" to "messages",
                  "इन्स्टाग्राम" to "instagram", "इंस्टाग्राम" to "instagram",
                  "फेसबुक" to "facebook", "टेलिग्राम" to "telegram", "मॅप" to "maps", "मैप" to "maps"
              )

              private fun tryOpenApp(spoken: String): Boolean {
                  var name = spoken.lowercase(Locale.ROOT)
                  if (triggers.none { name.contains(it) }) return false
                  triggers.forEach { name = name.replace(it, " ") }
                  fillers.forEach { name = name.replace(Regex("(^|\\s)" + Regex.escape(it) + "(\\s|$)"), " ") }
                  name = name.trim()
                  aliases.forEach { (k, v) -> if (name.contains(k)) name = v }
                  if (name.length < 2) return false

                  val pm = packageManager
                  val launcher = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val match = pm.queryIntentActivities(launcher, 0)
                      .map { it.loadLabel(pm).toString() to it.activityInfo.packageName }
                      .firstOrNull { (label, _) -> label.lowercase(Locale.ROOT).contains(name) }
                      ?: return false

                  val (label, pkg) = match
                  val q = msg("$label उघडू का?", "$label खोलूँ?", "Open $label?")
                  addChat("भैया", q)
                  speak(q)
                  AlertDialog.Builder(this)
                      .setTitle(q)
                      .setPositiveButton(msg("हो", "हाँ", "Yes")) { _, _ ->
                          pm.getLaunchIntentForPackage(pkg)?.let { startActivity(idroid="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="@color/green" />
          </shape>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
